# Optional: full stack with PostgreSQL. Run: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator
      POSTGRES_DB: estimator
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator"]
      interval: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://estimator:estimator@db:5432/estimator
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
